name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: python deps
        run: pip install pillow
      - name: rsrc
        run: go install github.com/akavel/rsrc@latest
      - name: build exe
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\go\bin"
          ./tray/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: tray/TGDrive-Easy.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev libfuse2
      - name: build
        run: |
          npm --prefix app install --omit=dev --no-audit --no-fund
          bash unix/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: |
            unix/dist/tgdrive-easy
            unix/dist/tgdrive-easy.sh
            unix/dist/tgdrive-easy.desktop

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: build
        run: |
          npm --prefix app install --omit=dev --no-audit --no-fund
          bash unix/build.sh
      - name: package
        run: |
          cd unix/dist
          zip -r ../../TGDrive-Easy-macos.zip tgdrive-easy tgdrive-easy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: TGDrive-Easy-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/TGDrive-Easy.exe
            artifacts/linux-binary/*
            artifacts/macos-binary/TGDrive-Easy-macos.zip
