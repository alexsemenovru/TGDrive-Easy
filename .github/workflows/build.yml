name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: python deps
        run: pip install pillow
      - name: rsrc
        run: go install github.com/akavel/rsrc@latest
      - name: build exe
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\go\bin"
          ./tray/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: tray/TGDrive-Easy.exe

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: system deps
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev libfuse2
      - name: build
        run: |
          npm --prefix app install --omit=dev --no-audit --no-fund
          bash unix/build.sh
      - name: package AppImage
        run: |
          bash unix/package-appimage.sh
          mv unix/dist/TGDrive-Easy-x86_64.AppImage unix/dist/TGDrive-Easy-x86_64-beta.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: unix/dist/TGDrive-Easy-x86_64-beta.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: build
        run: |
          npm --prefix app install --omit=dev --no-audit --no-fund
          bash unix/build.sh
      - name: package .app
        run: |
          bash unix/package-macos.sh
          mv unix/dist/TGDrive-Easy-macos.zip unix/dist/TGDrive-Easy-macos-beta.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: unix/dist/TGDrive-Easy-macos-beta.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; | sort -k2 > SHA256SUMS.txt
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            artifacts/windows-exe/TGDrive-Easy.exe
            artifacts/linux-appimage/TGDrive-Easy-x86_64-beta.AppImage
            artifacts/macos-app/TGDrive-Easy-macos-beta.zip
            artifacts/SHA256SUMS.txt
